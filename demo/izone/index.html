<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>I Zone Office Assistant · Noor AI Concierge</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* One app holding every demo built for I Zone. Home = three app cards; switch apps from the sidebar (laptop)
   or the app pill at the top (phone). Noor AI Concierge design system: navy ink, soft paper, amber only on
   things you tap. Every screen leads with the answer, the proof sits underneath. */
:root{
  --paper:#f6f7fa; --surface:#ffffff; --ink:#111a2e; --muted:#566079; --faint:#8a93a8; --line:#e3e7ef; --line-2:#d3d9e4;
  --accent:#f0a23b; --accent-ink:#1b1204; --accent-soft:#fdf0dc;
  --navy:#1d2f57; --navy-soft:#e9eef8;
  --good:#1f8a52; --good-soft:#e4f4ea; --bad:#cf3f33; --bad-soft:#fbe7e4; --warn:#a86a10; --warn-soft:#fdf2df;
  --sA:#3b6fd8; --sB:#0f9688; --sC:#8b5cf6; --sD:#e0703b;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 1px 2px rgba(17,26,46,.04),0 8px 24px -12px rgba(17,26,46,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}
.ws{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:0 8px}
.ws-logo{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 14px var(--display);letter-spacing:.02em;flex:none}
.ws b{display:block;font:600 14.5px var(--display);letter-spacing:-.01em}
.ws small{color:var(--faint);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:14px 12px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14.5px;transition:background .2s,color .2s}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button.appbtn[data-on="1"]{color:var(--ink);font-weight:600}
.nav button.sub{padding:8px 12px 8px 42px;font-size:14px}
.nav button[aria-current="page"]{background:var(--navy-soft);color:var(--navy);font-weight:600}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--paper);font-size:12.5px;color:var(--muted);line-height:1.45}
.side-foot b{color:var(--ink);font-weight:600}

main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.top{display:flex;align-items:center;gap:12px;padding-block:18px 8px;max-width:1080px;margin:0 auto}
.top .crumb{color:var(--faint);font-size:13px}
.apppill{all:unset;cursor:pointer;display:none;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.apppill .ai{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.apppill .ai svg{width:16px;height:16px}
.apppill .chev{width:16px;height:16px;color:var(--faint)}
.top .demo{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.top .demo i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--warn);display:grid;place-items:center;font:600 13px var(--display);flex:none}
.screen{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hello h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.hello p{color:var(--muted);margin-top:6px;max-width:62ch}

/* app switch sheet (phone) */
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(17,26,46,.35);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheetbox{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheetbox .grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:4px auto 10px}
.sheetbox h3{font-size:1.05rem;padding:0 4px 6px}
.swi{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line)}
.swi[aria-current="true"]{border-color:var(--navy);background:var(--navy-soft)}
.swi .ai{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.swi .ai svg{width:20px;height:20px}
.swi b{display:block;font-weight:600}
.swi span{color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.25rem}
.card .sub{color:var(--muted);font-size:14px;margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font:600 1.65rem/1.15 var(--display);letter-spacing:-.02em;margin-top:4px}
.kpi small{color:var(--faint);font-size:12.5px}
.kpi.good b{color:var(--good)} .kpi.bad b{color:var(--bad)} .kpi.navy b{color:var(--navy)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 14.5px/1 var(--body);padding:13px 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);transition:transform .2s var(--ease),box-shadow .2s;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px -10px var(--accent)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:hover{box-shadow:none;border-color:var(--muted)}
.btn.sm{padding:9px 14px;min-height:38px;font-size:13.5px}
.btn svg{width:17px;height:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.navy{background:var(--navy-soft);color:var(--navy)} .chip.plain{background:var(--paper);color:var(--muted)}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- hub ---------- */
.hub-hero{display:flex;flex-direction:column;gap:8px;padding-block:8px 4px}
.hub-hero h1{font-size:clamp(1.8rem,4vw,2.6rem);max-width:20ch}
.hub-hero p{color:var(--muted);max-width:60ch;font-size:15.5px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.appcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;position:relative;overflow:hidden}
.appcard:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:0 2px 4px rgba(17,26,46,.04),0 24px 40px -20px rgba(17,26,46,.25)}
.appcard .big{width:52px;height:52px;border-radius:15px;background:var(--navy);color:#fff;display:grid;place-items:center}
.appcard .big svg{width:26px;height:26px}
.appcard h2{font-size:1.35rem}
.appcard p{color:var(--muted);font-size:14.5px}
.appcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.appcard li{display:flex;gap:8px;align-items:flex-start}
.appcard li svg{width:16px;height:16px;color:var(--good);flex:none;margin-top:3px}
.appcard .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line);font-weight:600;color:var(--navy)}
.appcard .go svg{width:20px;height:20px;transition:transform .25s var(--ease)}
.appcard:hover .go svg{transform:translateX(4px)}
.appcard .tagl{position:absolute;top:22px;right:22px}
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:13.5px;justify-content:center;padding:6px 0}
.strip span{display:inline-flex;align-items:center;gap:8px}
.strip svg{width:16px;height:16px;color:var(--navy)}

/* ---------- procurement: overview ---------- */
.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.step{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .25s var(--ease),border-color .2s}
.step:hover{transform:translateY(-3px);border-color:var(--line-2)}
.step .ic{width:38px;height:38px;border-radius:11px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center}
.step .ic svg{width:20px;height:20px}
.step .n{color:var(--faint);font-size:12.5px;font-weight:500}
.step h3{font-size:1.08rem}
.step p{color:var(--muted);font-size:13.5px}
.step .res{margin-top:auto;font-weight:600;font-size:13.5px;color:var(--navy)}
.step::after{content:"";position:absolute;right:-9px;top:34px;width:6px;height:6px;border-top:2px solid var(--line-2);border-right:2px solid var(--line-2);transform:rotate(45deg)}
.step:last-child::after{display:none}
.todo{display:flex;flex-direction:column}
.todo-i{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.todo-i:first-child{border-top:0;padding-top:4px}
.todo-i .dot{width:10px;height:10px;border-radius:50%;flex:none}
.todo-i .tx{flex:1;min-width:0}
.todo-i .tx b{display:block;font-weight:600}
.todo-i .tx span{color:var(--muted);font-size:13.5px}

/* requests */
.convert{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1.25fr);gap:14px;align-items:center}
.wa{background:#e9f5ec;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.wa .who{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.wa .who b{color:#1f9d55}
.bub{background:#fff;border-radius:4px 14px 14px 14px;padding:10px 12px;box-shadow:0 1px 1px rgba(0,0,0,.06);font-size:14.5px}
.bub small{display:block;text-align:right;color:var(--faint);font-size:11px;margin-top:4px}
.arrowbig{display:grid;place-items:center;color:var(--accent)}
.arrowbig svg{width:40px;height:40px}
.arrowbig span{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap}
.order{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.order-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--navy);color:#fff}
.order-h b{font:600 15px var(--display)}
.order-h span{font-size:12.5px;opacity:.8}
.oline{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.oline:first-of-type{border-top:0}
.oline b{font-weight:600;white-space:nowrap}
.oline .tick{color:var(--good);margin-right:6px}
.fadein{opacity:0;transform:translateY(6px);animation:in .4s var(--ease) forwards}
.sup-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sup-row:first-child{border-top:0}
.sup-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 14px var(--display);flex:none}
.sup-row b{display:block;font-weight:600}
.sup-row span{color:var(--muted);font-size:13px}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.req:first-child{border-top:0}
.req b{font-weight:600}
.req .meta{grid-column:1/-1;color:var(--muted);font-size:13px}
.req .meta.late{color:var(--bad);font-weight:500}

/* quotes */
.winner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(135deg,#14234a,#1d2f57 60%,#24386a);color:#fff;border:0}
.winner .lbl{font-size:13px;color:#b9c5e0;font-weight:500}
.winner h2{font-size:clamp(1.5rem,3vw,2rem);margin-top:4px;color:#fff}
.winner .facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;color:#dfe6f5;font-size:14px}
.winner .facts b{color:#fff}
.winner .why{margin-top:10px;color:#b9c5e0;font-size:13.5px;max-width:60ch}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.seg button{padding:8px 10px;font-size:13px}}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch input:checked{background:var(--navy)}
.switch input:checked::after{transform:translateX(16px)}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;padding-top:8px}
.offer{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);position:relative;transition:opacity .3s,border-color .3s;box-shadow:var(--shadow)}
.offer.best{border:2px solid var(--good);padding:15px}
.offer.out{opacity:.55}
.offer-h{display:flex;align-items:center;gap:10px}
.offer-h b{font-weight:600}
.offer .total{font:600 1.45rem var(--display);letter-spacing:-.02em}
.offer .total small{font:500 12.5px var(--body);color:var(--muted);letter-spacing:0;display:block}
.offer dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.offer dt{color:var(--muted)} .offer dd{margin:0;text-align:right;font-weight:500}
.ribbon{position:absolute;top:-11px;left:14px;background:var(--good);color:#fff;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px}
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
th{font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:var(--paper);font-size:12.5px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.best{color:var(--good);font-weight:600;background:var(--good-soft)}
td.flag{color:var(--warn)}
td.na{color:var(--faint)}
.insights{display:flex;flex-direction:column;gap:10px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--paper);font-size:14px}
.ins .ii{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.ins .ii svg{width:16px;height:16px}
.ins.bad .ii{background:var(--bad-soft);color:var(--bad)} .ins.warn .ii{background:var(--warn-soft);color:var(--warn)} .ins.good .ii{background:var(--good-soft);color:var(--good)} .ins.navy .ii{background:var(--navy-soft);color:var(--navy)}
.ins b{font-weight:600}

/* LPO document */
.sheet{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 20px 50px -24px rgba(17,26,46,.35);position:relative;overflow:hidden;font-size:13.5px}
.sheet .lh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:12px;flex-wrap:wrap}
.sheet .lh b{font:700 15px var(--display);color:var(--navy)}
.sheet .lh small{display:block;color:var(--muted);font-size:12px}
.sheet .doc-t{font:600 1.1rem var(--display);text-align:right;padding-right:40px}
.sheet .meta2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin-bottom:12px}
.sheet .meta2 span{display:block;color:var(--muted);font-size:12px}
.sheet table{min-width:520px;font-size:13px}
.sheet .tot{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:10px}
.sheet .tot div{display:flex;gap:24px;min-width:220px;justify-content:space-between}
.sheet .tot .g{font:600 1.05rem var(--display);border-top:1px solid var(--line);padding-top:6px}
.stamp{position:absolute;right:-34px;top:22px;transform:rotate(35deg);background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:11px;letter-spacing:.08em;padding:4px 44px;text-transform:uppercase}
.stamp.ok{background:var(--good-soft);color:var(--good)}

/* prices */
.items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.items button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--muted)}
.items button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

function base(k,t){const a=ITEMS[k].anchors;if(t<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++){if(t<=a[i][0]){const[t0,v0]=a[i-1],[t1,v1]=a[i];return v0+(v1-v0)*(t-t0)/(t1-t0)}}return a[a.length-1][1]}

const PRIO={bal:["Balanced",[60,25,15]],cheap:["Lowest price",[100,0,0]],fast:["Fastest",[30,70,0]],credit:["Longest credit",[40,10,50]]};
function ranking(){
  const[wP,wD,wT]=PRIO[S.prio][1],sum=wP+wD+wT;
  const rows=Object.keys(SUP).map(s=>{const{t,miss}=supTotal(s);const badMake=Q[s].bad.length>0;
    const out=miss>0||(S.approvedOnly&&badMake);return{s,t,miss,badMake,out,days:Q[s].days,terms:Q[s].terms}});
  const live=rows.filter(r=>!r.out);
  const minT=Math.min(...live.map(r=>r.t)),minD=Math.min(...live.map(r=>r.days)),maxTm=Math.max(...live.map(r=>r.terms))||1;
  for(const r of rows)r.score=r.out?0:Math.round(100*(wP*minT/r.t+wD*minD/r.days+wT*r.terms/maxTm)/sum);
  return rows.sort((a,b)=>(a.out-b.out)||(b.score-a.score));
}

function procPrices(){

  for(let i=0;i<=3;i++){const p=lo+(hi-lo)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(p)}" y2="${Y(p)}" stroke="#e3e7ef"/><text x="${L-8}" y="${Y(p)+4}" text-anchor="end">${p>=100?Math.round(p):p.toFixed(1)}</text>`}
  for(let y=2021;y<=2026;y++)g+=`<text x="${X(y)}" y="${H-8}">${y}</text>`;

    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price paid since 2021">${g}</svg>
    <div class="legend">${Object.keys(SUP).filter(s=>st.r.some(x=>x.s===s)).map(s=>`<span><span class="sd" style="background:${SUP[s].col}"></span>${SUP[s].name}</span>`).join("")}<span><span style="width:16px;height:2px;background:#1d2f57;opacity:.55;display:inline-block"></span>Market level</span></div>
  </div>
  <div class="kpis">
    <div class="kpi"><span>Bought since 2021</span><b class="num">${st.r.length} times</b><small>about every ${Math.round(st.gap)} days</small></div>

      <div class="checkq" style="margin-top:12px"><label class="field"><span>AED</span><input id="qv" type="number" inputmode="decimal" step="0.01" value="${def}"><span>per ${it.unit}</span></label><button class="btn" id="qgo">Check</button></div>

function checkQuote(){

function cadd(cls,text){const d=document.createElement("div");d.className="cm "+cls;d.textContent=text;clog.appendChild(d);cscroll();return d}
function cnote(text){const d=document.createElement("div");d.className="cnote";d.textContent=text;clog.appendChild(d);cscroll()}
function cchips(list){const d=document.createElement("div");d.className="cchips";list.forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>{d.remove();cuser(t)};d.appendChild(b)});clog.appendChild(d);cscroll()}
function cscroll(){requestAnimationFrame(()=>{clog.scrollTop=clog.scrollHeight})}
function cclear(){clog.querySelectorAll(".cchips").forEach(c=>c.remove())}
function cparse(t){const s=t.toLowerCase(),o={};let m;
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:m|mtr|mtrs|metre|meter|meters|metres)\b/))o.len=+m[1];
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:mm2|mm²|mm|sq\s?mm|sqmm)/)){const v=+m[1];if(SIZES.includes(v))o.size=v}
  if(m=s.match(/(\d+(?:\.\d+)?)\s*kw\b/))o.kw=+m[1];
  if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:a|amp|amps|ampere)\b/))o.amps=+m[1];
  if(m=s.match(/(\d+)\s*(?:runs?|cables|nos)\b/))o.runs=+m[1];
  if(/trench|underground|buried|ground/.test(s))o.method="trench";
  else if(/tray|ladder/.test(s))o.method="tray";
  else if(/conduit|in wall|pipe|concealed/.test(s))o.method="conduit";
  else if(/clip|surface|on wall/.test(s))o.method="clipped";
  if(/single|1\s?-?\s?phase|230\s?v/.test(s))o.phase=1;
  else if(/three|3\s?-?\s?phase|400\s?v|415/.test(s))o.phase=3;
  return o}
function cuser(t){cclear();cadd("me",t);setTimeout(()=>creply(t),320)}
function creply(t){
  const s=t.toLowerCase();
  if(cmode==="lead"){cmode="menu";LEADS.unshift({who:t,spec:clast?clast.summary:"Cable job",at:new Date()});
    cadd("bot","Thank you. An I Zone engineer will call you to confirm the details and send the formal quote.");
    cnote("The request is now in “Requests” for the engineer.");cchips(["New estimate","Book a site visit"]);syncNav();return}
  if(cmode==="visit"){cmode="menu";LEADS.unshift({who:"Site visit request",spec:t,at:new Date()});
    cadd("bot","Noted. The engineer will call you to fix the time.");cnote("The visit request is now in “Requests”.");cchips(["Cable estimate"]);syncNav();return}
  if(/site visit|visit/.test(s)){cmode="visit";cadd("bot","Sure. Please send the location (area and building) and the day that suits you.");return}
  if(/engineer|human|call me|talk/.test(s)&&!/send to engineer/.test(s)){cmode="lead";cadd("bot","Of course. Please send your name and mobile number and an engineer will call you.");return}
  if(/send to engineer|formal quote/.test(s)){cmode="lead";cadd("bot","Please send your name and mobile number. The engineer will check the site and send the formal quote.");return}
  if(/new estimate|cable estimate|estimate|price|quote|cost/.test(s)&&Object.keys(cparse(t)).length===0){
    job={};cmode="est";cadd("bot","Tell me the job in one line, for example:\n“60 m, 45 kW AC unit, trench”\n“25 mm² 4-core, 120 m on cable tray”");return}
  const p=cparse(t);
  if(Object.keys(p).length){cmode="est";Object.assign(job,p);return cask()}
  if(cmode==="est")return cask(true);
  cadd("bot","I can give you a quick cable estimate, book a site visit, or put you through to an engineer.");
  cchips(["Cable estimate","Book a site visit","Talk to an engineer"]);
}
function cask(confused){

      if(myRates[rkey(r)]!=null){r.rate=myRates[rkey(r)];r.mine=true}rows.push(r)});
    (j.assumptions||[]).forEach(a=>assumptions.push(`${sh}: ${a}`));(j.questions||[]).forEach(q=>questions.push(`${sh}: ${q}`))});
  DST={sheets:ok.length,seconds:(performance.now()-t0)/1000,example:false,name:ok.length===1?ok[0].s.name:ok.length+" sheets",rows,assumptions,questions};
  go("boq");
}
function drawUpload(){
  return`<div class="hello"><h1>Drawing to priced BOQ</h1><p>Upload an MEP drawing. The assistant reads the schedules, counts symbols against the legend, measures runs where a scale is given, and prices every line. Your estimator checks it instead of starting from zero.</p></div>
  <div id="dropMount"></div>
  <div class="cols">
    <div class="card"><h2>What it reads</h2><div class="insights" style="margin-top:12px">
      <div class="ins navy"><div class="ii">${I.table}</div><div><b>Schedules and tables</b>: DB schedules, cable schedules, equipment lists, exactly as written.</div></div>
      <div class="ins navy"><div class="ii">${I.plan}</div><div><b>Layouts</b>: counts every symbol using the legend, measures runs at the drawing scale.</div></div>
      <div class="ins navy"><div class="ii">${I.bulb}</div><div><b>Gaps</b>: lists its assumptions and the questions your engineer must answer.</div></div>
    </div></div>
    <div class="card"><h2>No drawing to hand?</h2><p class="sub">See the result for a sample villa sheet first.</p>
      <div class="row" style="margin-top:14px"><button class="btn ghost" data-go="boq">See the example estimate</button></div></div>
  </div>`;
}
function drawBoq(){
  let direct=0;const body=[];
  const cats=[...CATS,...new Set(DST.rows.map(r=>r.category).filter(c=>!CATS.includes(c)))];
  cats.forEach(cat=>{const rows=DST.rows.filter(r=>r.category===cat);if(!rows.length)return;
    body.push(`<tr class="cat"><td colspan="7">${esc(cat)}</td></tr>`);
    rows.forEach(r=>{const i=DST.rows.indexOf(r),amt=(+r.qty||0)*(+r.rate||0);direct+=amt;
      body.push(`<tr><td>${esc(r.item)}<span class="basis">${esc(r.basis)}</span></td><td>${esc(r.spec)}</td>
        <td class="r"><input type="number" min="0" step="any" value="${+r.qty||0}" data-bq="${i}" aria-label="Quantity"> <span style="color:var(--faint)">${esc(r.unit)}</span></td>
        <td><span class="src ${esc(r.source)}">${esc(r.source)}</span>${r.confidence==="low"?' <span class="conf-low">check</span>':""}</td>
        <td class="r"><input type="number" min="0" step="any" value="${+r.rate||0}" data-br="${i}" aria-label="Rate"><span class="basis">${r.mine?'<span class="yours">your rate</span>':"guide"}</span></td>
        <td class="r">${Math.round(amt).toLocaleString("en-US")}</td><td>${esc(r.sheet)}</td></tr>`)})});
  const mg=direct*margin/100,vat=(direct+mg)*.05,total=direct+mg+vat;
  const low=DST.rows.filter(r=>r.confidence==="low"||r.source==="assumed").length;
  const fmtT=s=>s<60?Math.round(s)+" s":Math.floor(s/60)+" min "+Math.round(s%60)+" s";
  return`<div class="hello"><h1>Estimate${DST.example?"":": "+esc(DST.name)}</h1><p>${DST.example?"Example result for a sample villa sheet, not a real I Zone job. Upload your own drawing to replace it.":"Read from your drawing. Change any quantity or rate; your rates are remembered for the next drawing."}</p></div>
  <div class="card winner"><div><div class="lbl">Estimate incl. VAT${DST.example?" · example":""}</div><h2 class="num">${AED0(total)}</h2>
    <div class="facts"><span><b>${DST.rows.length}</b> BOQ lines</span><span><b>${DST.sheets}</b> sheet${DST.sheets>1?"s":""} read</span><span><b>${low}</b> lines to check</span>${DST.seconds?`<span>Done in <b>${fmtT(DST.seconds)}</b></span>`:""}</div>
    <div class="why">Green = read from a schedule or counted. Blue = measured at scale. Amber = assumed, check it.</div></div>
    ${downloadsCap?`<button class="btn" id="bCsv">Download for Excel</button>`:`<button class="btn" data-go="upload">Upload a drawing</button>`}</div>
  <div class="card boq"><h2>Bill of quantities</h2><div class="tablewrap"><table><thead><tr><th>Item</th><th>Spec / size</th><th class="r">Qty</th><th>Source</th><th class="r">Rate AED</th><th class="r">Amount AED</th><th>Sheet</th></tr></thead><tbody>${body.join("")}</tbody></table></div>
    <div class="totals"><div><span>Direct cost</span><b class="num">${AED0(direct)}</b></div>
      <div><span>Overheads &amp; profit <input type="number" min="0" step="1" value="${margin}" id="bMargin" aria-label="Margin percent"> %</span><b class="num">${AED0(mg)}</b></div>
      <div><span>VAT 5%</span><b class="num">${AED0(vat)}</b></div><div class="g"><span>Total</span><span class="num">${AED0(total)}</span></div></div>
    <p class="status" id="bMsg" style="margin-top:8px"></p></div>
  <div class="cols">
    <div class="card"><h2>Assumptions made</h2><div class="insights" style="margin-top:12px">${(DST.assumptions.length?DST.assumptions:["None."]).map(a=>`<div class="ins warn"><div class="ii">${I.x}</div><div>${esc(a)}</div></div>`).join("")}</div></div>
    <div class="card"><h2>Questions for your engineer</h2><div class="insights" style="margin-top:12px">${(DST.questions.length?DST.questions:["None."]).map(a=>`<div class="ins navy"><div class="ii">${I.bulb}</div><div>${esc(a)}</div></div>`).join("")}</div></div>
  </div>`;
}
async function boqCsv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const out=[["Sheet","Category","Item","Spec","Qty","Unit","Rate AED","Amount AED","Source","Confidence","Basis"].map(q).join(",")];let direct=0;
  DST.rows.forEach(r=>{const a=(+r.qty||0)*(+r.rate||0);direct+=a;out.push([r.sheet,r.category,r.item,r.spec,r.qty,r.unit,r.rate,Math.round(a),r.source,r.confidence,r.basis].map(q).join(","))});
  const mg=direct*margin/100,vat=(direct+mg)*.05;
  out.push("",[q("Direct cost"),"","","","","","",Math.round(direct)].join(","),[q(`Overheads & profit ${margin}%`),"","","","","","",Math.round(mg)].join(","),[q("VAT 5%"),"","","","","","",Math.round(vat)].join(","),[q("Total"),"","","","","","",Math.round(direct+mg+vat)].join(","));
  try{await downloadsCap.save({filename:"I-Zone-estimate.csv",data:"﻿"+out.join("\r\n")});$("#bMsg").textContent="Saved."}
  catch(e){$("#bMsg").textContent=e?.code==="declined"?"":"Download is not available here."}
}

/* ================= shell render ================= */
const VIEWS={hub,"proc:home":procHome,"proc:request":procRequest,"proc:quotes":procQuotes,"proc:prices":procPrices,"proc:invoices":procInvoices,
  "cable:chat":cableChat,"cable:rates":cableRates,"cable:leads":cableLeads,"draw:upload":drawUpload,"draw:boq":drawBoq};
const cur=()=>S.app==="hub"?"hub":S.app+":"+S.page[S.app];
function badge(app,page){
  if(app==="proc"&&page==="invoices"){const n=badCount();return n?`<span class="count">${n}</span>`:""}
  if(app==="cable"&&page==="leads"&&LEADS.length)return`<span class="count">${LEADS.length}</span>`;
  return "";
}
function syncNav(){
  let side=`<button data-app="hub" ${S.app==="hub"?'aria-current="page"':""}>${I.grid}<span>All tools</span></button><div class="grp">Tools</div>`;
  for(const[id,a]of Object.entries(APPS)){
    side+=`<button class="appbtn" data-app="${id}" data-on="${S.app===id?1:0}">${a.icon}<span>${a.name}</span></button>`;
    if(S.app===id)side+=a.pages.map(([p,label])=>`<button class="sub" data-go="${p}" ${S.page[id]===p?'aria-current="page"':""}><span>${label}</span>${badge(id,p)}</button>`).join("");
  }
  $("#sideNav").innerHTML=side;
  $("#botNav").innerHTML=S.app==="hub"?"":APPS[S.app].pages.map(([p,label,ic])=>`<button data-go="${p}" ${S.page[S.app]===p?'aria-current="page"':""}>${ic}<span>${label}</span>${badge(S.app,p)}</button>`).join("");
  const a=S.app==="hub"?{name:"All tools",icon:I.grid}:APPS[S.app];
  $("#appPill").innerHTML=`<span class="ai">${a.icon}</span>${a.name}<span class="chev">${I.chev}</span>`;
  $("#crumb").textContent=S.app==="hub"?"I Zone / All tools":`I Zone / ${APPS[S.app].name} / ${APPS[S.app].pages.find(p=>p[0]===S.page[S.app])[1]}`;
}
function render(){
  syncNav();
  $("#view").innerHTML=`<div class="screen">${VIEWS[cur()]()}</div>`;
  const cm=$("#chatMount");if(cm){if(!chatNode)buildChat();cm.replaceWith(chatNode)}
  const dm=$("#dropMount");if(dm){if(!dropNode)buildDrop();dm.replaceWith(dropNode);
    const av=dropNode.querySelector("#dAvail");av.innerHTML=capsChecked&&(!sampleCap||!maxImages)?'<div class="warnbox">Reading your own drawings is switched on in the pilot. The example estimate works now.</div>':""}
  bind();
}
function go(p){S.page[S.app]=p;render();window.scrollTo({top:0,behavior:"smooth"});saveHash()}
function goApp(a){S.app=a;closeSheet();render();window.scrollTo({top:0,behavior:"smooth"});saveHash()}
function saveHash(){try{history.replaceState(null,"","#"+(S.app==="hub"?"hub":S.app+"-"+S.page[S.app]))}catch(e){}}
document.addEventListener("click",e=>{
  const ap=e.target.closest("[data-app]");if(ap){e.preventDefault();goApp(ap.dataset.app);return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}
});
function openSheet(){
  const h=$("#sheetHost");
  h.innerHTML=`<div class="sheetbg" id="sbg"><div class="sheetbox" role="dialog" aria-label="Switch tool"><div class="grab"></div><h3>Switch tool</h3>
    <button class="swi" data-app="hub" aria-current="${S.app==="hub"}"><span class="ai">${I.grid}</span><div><b>All tools</b><span>Start page</span></div></button>
    ${Object.entries(APPS).map(([id,a])=>`<button class="swi" data-app="${id}" aria-current="${S.app===id}"><span class="ai">${a.icon}</span><div><b>${a.name}</b><span>${a.line}</span></div></button>`).join("")}</div></div>`;
  $("#sbg").addEventListener("click",e=>{if(e.target.id==="sbg")closeSheet()});
}
function closeSheet(){$("#sheetHost").innerHTML=""}
$("#appPill").onclick=openSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function bind(){
  document.querySelectorAll("[data-prio]").forEach(b=>b.onclick=()=>{S.prio=b.dataset.prio;S.lpo=null;S.lpoApproved=false;render()});
  const ap=$("#appr");if(ap)ap.onchange=()=>{S.approvedOnly=ap.checked;S.lpo=null;S.lpoApproved=false;render()};
  const mk=$("#mkLpo");if(mk)mk.onclick=()=>{S.lpo=ranking()[0].s;S.lpoApproved=false;$("#lpoBox").innerHTML=lpoHTML();bindLpo();$("#lpoBox").scrollIntoView({behavior:"smooth",block:"start"})};
  bindLpo();
  document.querySelectorAll("[data-item]").forEach(b=>b.addEventListener("click",()=>{S.item=b.dataset.item;if(cur()==="proc:prices")render()}));
  const qg=$("#qgo");if(qg){qg.onclick=checkQuote;$("#qv").onkeydown=e=>{if(e.key==="Enter")checkQuote()};checkQuote()}
  document.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>{const i=+b.dataset.inv;S.openInv.has(i)?S.openInv.delete(i):S.openInv.add(i);render()});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{invDone.add(+b.dataset.act);render()});
  const pa=$("#payAll");if(pa)pa.onclick=()=>{INV.forEach((i,ix)=>{if(invCheck(i).cls==="good")invDone.add(ix)});render()};
  document.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{cuser(b.dataset.try);chatNode.scrollIntoView({behavior:"smooth",block:"center"})});
  document.querySelectorAll("[data-rg]").forEach(i=>i.addEventListener("input",()=>{const v=parseFloat(i.value);if(!isNaN(v)){RT[i.dataset.rg][i.dataset.rk]=v;saveRT()}}));
  const rr=$("#rtReset");if(rr)rr.onclick=()=>{RT=JSON.parse(JSON.stringify(RSAMPLE));saveRT();render()};
  document.querySelectorAll("[data-bq]").forEach(i=>i.onchange=()=>{DST.rows[+i.dataset.bq].qty=+i.value||0;render()});
  document.querySelectorAll("[data-br]").forEach(i=>i.onchange=()=>{const r=DST.rows[+i.dataset.br];r.rate=+i.value||0;r.mine=true;myRates[rkey(r)]=r.rate;saveMy();render()});
  const bm=$("#bMargin");if(bm)bm.onchange=()=>{margin=+bm.value||0;render()};
  const bc=$("#bCsv");if(bc)bc.onclick=boqCsv;
}
function bindLpo(){const a=$("#apprLpo");if(a)a.onclick=()=>{S.lpoApproved=true;$("#lpoBox").innerHTML=lpoHTML()}}
(()=>{const h=location.hash.slice(1);if(!h||h==="hub")return;const[a,p]=h.split("-");if(APPS[a]){S.app=a;if(p&&APPS[a].pages.some(x=>x[0]===p))S.page[a]=p}})();
render();
</script>

</body></html>
